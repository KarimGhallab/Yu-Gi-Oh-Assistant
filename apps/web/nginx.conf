server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The client is a single-page app: unknown paths fall back to the shell so a
  # deep link such as a conversation URL still loads.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API is proxied to the server, so the browser talks to one origin and no
  # CORS is needed. Buffering is off and timeouts are long because the turn
  # endpoint streams server-sent events.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /health {
    proxy_pass http://server:3000;
  }
}
