name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  unit:
    name: Unit
    needs: verify
    uses: ./.github/workflows/unit.yml

  e2e:
    name: End-to-end
    needs: unit
    uses: ./.github/workflows/e2e.yml

  success:
    name: Pipeline successful
    needs: [verify, unit, e2e]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "CI pipeline successful."
