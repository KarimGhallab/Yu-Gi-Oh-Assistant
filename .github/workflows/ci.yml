name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  unit:
    name: Unit
    needs: verify
    uses: ./.github/workflows/unit.yml

  e2e:
    name: End-to-end
    needs: unit
    uses: ./.github/workflows/e2e.yml

  pipeline-success:
    name: Pipeline successful
    needs:
      - verify
      - unit
      - e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
