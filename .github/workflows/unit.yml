name: Unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace packages
        run: pnpm build

      - name: Unit and integration tests
        run: pnpm test:unit
