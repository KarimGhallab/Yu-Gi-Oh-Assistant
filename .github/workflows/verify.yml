name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint + check import + pnpm audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Check imports
        run: pnpm run deps-cruise:check

      - name: Audit the installed dependencies
        run: pnpm audit --audit-level=high
