name: End-to-end

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the Playwright engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the engine
        run: pnpm --filter @ygo-assistant/e2e exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build the app for the suite
        run: pnpm build:e2e

      - name: Run the suite
        run: pnpm --filter @ygo-assistant/e2e exec playwright test --project=${{ matrix.browser }}

      - name: Keep the traces and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
