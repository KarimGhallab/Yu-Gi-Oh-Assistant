name: Setup
description: Install the pinned toolchain and the workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12.15.0

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: '26.12.1'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
